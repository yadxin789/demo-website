; ============================================================================
;  PHP-FPM 池配置 —— 2C2G 轻量应用服务器（腾讯云）
;
;  用法：
;    sudo cp deploy/php-fpm-demo-website.conf /etc/php/8.3/fpm/pool.d/demo-website.conf
;    sudo sed -i '/^\[www\]/,/^\[/ s/^;*listen = .*/listen = \/run\/php\/php8.3-fpm.sock/' /etc/php/8.3/fpm/pool.d/www.conf
;    sudo systemctl restart php8.3-fpm
;
;  要点：
;   - 演示站并发低，用 static 固定 4 个 worker 即可，避免动态池在内存紧张时被 OOM
;   - SQLite 是单写者，worker 再多写请求也会排队，4 个足够
;   - 每个 worker memory_limit 256M，4 × 256M = 1G，留足系统与 MySQL/Nginx 余量
; ============================================================================

[demo-website]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-demo-website.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static
pm.max_children = 4

; 请求超时：演示站有导出 Excel/PDF 的慢请求，给到 120s
request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.3-fpm-demo-website-slow.log

; 环境变量沿用 .env（Laravel 自己读），这里只兜底时区
env[APP_ENV] = production
env[TZ] = Asia/Shanghai

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = Off
php_admin_flag[log_errors] = On

; ---- OPcache：S4-14 的核心，省掉每个请求重复编译 1300+ 文件 ----
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 12000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.save_comments] = 1
php_admin_value[opcache.fast_shutdown] = 1

php_admin_value[realpath_cache_size] = 4096k
php_admin_value[realpath_cache_ttl] = 600
