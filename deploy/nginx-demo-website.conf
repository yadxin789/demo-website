# ============================================================================
#  demo-website 单站点 Nginx 配置（HC-27：一个 vhost 承载五个产品）
#
#  用法：
#    sudo cp deploy/nginx-demo-website.conf /etc/nginx/sites-available/demo-website
#    sudo ln -sf /etc/nginx/sites-available/demo-website /etc/nginx/sites-enabled/demo-website
#    sudo rm -f /etc/nginx/sites-enabled/erp-shop
#    sudo nginx -t && sudo systemctl reload nginx
#
#  本机实际站点：yad-erp.com（证书 /etc/nginx/ssl/yad-erp.com_{bundle.pem,key}）
# ============================================================================

# ---------------------------------------------------------------------------
# 1) 域名 80 → 301 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yad-erp.com www.yad-erp.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# 2) IP 直连 HTTP 兜底（备案未完成阶段用 IP 也能演示）
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/demo-website/public;
    index index.php;

    client_max_body_size 20m;
    client_body_timeout 120s;
    fastcgi_read_timeout 120s;

    # 绝不能把 .env、SQLite 库、源码目录暴露出去
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(sqlite|sqlite3|db)$ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /vendor/ { deny all; }
    location ^~ /storage/logs/ { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_intercept_errors on;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|webp|avif)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}

# ---------------------------------------------------------------------------
# 3) 域名 HTTPS 主站
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name yad-erp.com www.yad-erp.com;

    root /var/www/demo-website/public;
    index index.php;

    client_max_body_size 20m;
    client_body_timeout 120s;
    fastcgi_read_timeout 120s;

    ssl_certificate     /etc/nginx/ssl/yad-erp.com_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/yad-erp.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(sqlite|sqlite3|db)$ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /vendor/ { deny all; }
    location ^~ /storage/logs/ { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_intercept_errors on;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|webp|avif)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
