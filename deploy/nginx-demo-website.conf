# ============================================================================
#  demo-website 单站点 Nginx 配置（HC-27：一个 vhost 承载五个产品）
#
#  用法：
#    sudo cp deploy/nginx-demo-website.conf /etc/nginx/sites-available/demo-website
#    sudo ln -sf /etc/nginx/sites-available/demo-website /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  上线前把 demo.example.com 换成自己的域名；备案未下来时先用 IP 段（default_server）验证。
# ============================================================================

# ---------------------------------------------------------------------------
# 1) IP 直连 / 备案未完成阶段的兜底站点
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/demo-website/public;
    index index.php;

    client_max_body_size 20m;
    client_body_timeout 120s;
    fastcgi_read_timeout 120s;

    # 绝不能把 .env、SQLite 库、源码目录暴露出去
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(sqlite|sqlite3|db)$ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /vendor/ { deny all; }
    location ^~ /storage/logs/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_intercept_errors on;
    }

    # 五产品的静态资源都在 public/assets/{erp,pm,shop,mes,hr,portal}/
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|webp|avif)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}

# ---------------------------------------------------------------------------
# 2) 域名站点（ICP 备案通过后启用；HTTPS 证书就位后把 443 段打开）
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com www.demo.example.com;

    root /var/www/demo-website/public;
    index index.php;

    client_max_body_size 20m;
    fastcgi_read_timeout 120s;

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(sqlite|sqlite3|db)$ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /vendor/ { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_intercept_errors on;
    }

    # 备案期间先用 HTTP；证书就位后取消下面注释并把上面的 80 段改为 301 跳转
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/demo.example.com_bundle.pem;
    # ssl_certificate_key /etc/nginx/ssl/demo.example.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # fastcgi_param HTTPS on;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|webp|avif)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
